<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Download Portal</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; text-align: center; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        #slider img { width: 100%; height: auto; border-radius: 8px; display: none; }
        #slider img.active { display: block; }
        h2 { color: #333; margin-top: 20px; }
        .input-group { text-align: left; margin-bottom: 15px; }
        .input-group label { display: block; font-weight: bold; margin-bottom: 5px; color: #555; font-size: 14px; }
        input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
        button { border: none; padding: 14px 20px; font-size: 16px; border-radius: 6px; cursor: pointer; margin-top: 10px; width: 100%; font-weight: bold; transition: 0.3s; }
        .btn-green { background-color: #28a745; color: white; }
        .btn-green:hover { background-color: #218838; }
        .btn-blue { background-color: #007bff; color: white; }
        .btn-blue:hover { background-color: #0069d9; }
        .hidden { display: none; }
        .payment-box { background: #e9ecef; padding: 15px; border-radius: 8px; margin-top: 20px; text-align: left; border-left: 4px solid #28a745; }
        .payment-box h3 { margin-top: 0; color: #333; font-size: 18px; }
        .proof-section { background: #f8f9fa; padding: 20px; border-radius: 8px; margin-top: 20px; border: 1px solid #dee2e6; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

<div class="container">
    <div id="slider">
        <img src="https://via.placeholder.com/600x300?text=Loading+Posters..." class="active" id="defaultPoster">
    </div>

    <h2>Game Download Portal</h2>
    
    <button id="mainBtn" class="btn-green" onclick="checkUserStatus()">Loading...</button>
    <p id="statusMsg" style="color: red; font-weight: bold; margin-top: 15px;"></p>

    <div id="userForm" class="hidden">
        <h3 style="color: #444; margin-bottom: 20px;">Apni Details Darj Karein</h3>
        
        <div class="input-group">
            <label>Full Name *</label>
            <input type="text" id="userName" placeholder="Apna naam likhein" required>
        </div>
        <div class="input-group">
            <label>Gmail ID *</label>
            <input type="email" id="userEmail" placeholder="example@gmail.com" required>
        </div>
        <div class="input-group">
            <label>WhatsApp Number *</label>
            <input type="number" id="userWa" placeholder="03XXXXXXXXX" required>
        </div>
        
        <div id="actionButtons">
            <button class="btn-green" onclick="showPaymentOptions()">Send Payment</button>
            <button class="btn-blue" onclick="showProofSection()">I have already sent payment</button>
        </div>

        <div id="paymentDetails" class="hidden payment-box">
            <h3>Payment Accounts</h3>
            <p><strong>Easypaisa:</strong> 03423944508 <br> Name: Muluk Hussain</p>
            <hr style="border: 0; border-top: 1px solid #ccc; margin: 10px 0;">
            <p><strong>JazzCash:</strong> 03285719803 <br> Name: Saima Jabeen</p>
            <button class="btn-blue" onclick="showProofSection()">Payment Send Kar Di Hai</button>
        </div>

        <div id="proofSection" class="hidden proof-section">
            <h3 style="margin-top: 0; color: #007bff;">Payment Proof</h3>
            <p style="font-size: 13px; color: #666; margin-bottom: 15px;">Neechay di gayi maloomat mukammal karein ta ke hum verify kar sakein.</p>
            
            <div class="input-group">
                <label>Payment TRX ID *</label>
                <input type="text" id="trxId" placeholder="TRX ID likhein (Zaroori hai)" required>
            </div>
            <div class="input-group">
                <label>Date (Optional)</label>
                <input type="date" id="paymentDate">
            </div>
            <div class="input-group">
                <label>Sender Account Name (Optional)</label>
                <input type="text" id="senderName" placeholder="Jis account se paise bheje">
            </div>
            
            <button id="submitBtn" class="btn-green" onclick="submitDetails()">Submit for Approval</button>
        </div>
    </div>
</div>

<script>
    // AAP KI FIREBASE CONFIGURATION
    const firebaseConfig = {
        databaseURL: "https://earn-platform-76c26-default-rtdb.firebaseio.com/"
    };
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    let driveLink = "";

    // Fetch Settings from Firebase
    db.ref('settings').on('value', (snapshot) => {
        const data = snapshot.val();
        if(data) {
            if(data.buttonText) {
                document.getElementById('mainBtn').innerText = data.buttonText;
            }
            if(data.driveLink) {
                driveLink = data.driveLink;
            }
            if(data.posters) {
                let slider = document.getElementById('slider');
                slider.innerHTML = '';
                let urls = data.posters.split(',');
                urls.forEach((url, index) => {
                    let img = document.createElement('img');
                    img.src = url.trim();
                    if(index === 0) img.classList.add('active');
                    slider.appendChild(img);
                });
            }
        }
    });

    function checkUserStatus() {
        let savedWa = localStorage.getItem('userWa');
        if(savedWa) {
            db.ref('users/' + savedWa).once('value').then((snapshot) => {
                let user = snapshot.val();
                if(user && user.status === 'approved') {
                    if(driveLink) {
                        window.open(driveLink, '_blank');
                    } else {
                        alert("New Updates upload ki ja rahi hain bahut jald file download k leye available ho jaye ge.");
                    }
                } else {
                    document.getElementById('statusMsg').innerText = "Aap ki request abhi Admin ne approve nahi ki. Bara-e-meharbani intezar karein.";
                }
            });
        } else {
            document.getElementById('userForm').classList.remove('hidden');
            document.getElementById('mainBtn').classList.add('hidden');
        }
    }

    function showPaymentOptions() {
        document.getElementById('paymentDetails').classList.remove('hidden');
        document.getElementById('proofSection').classList.add('hidden');
    }

    function showProofSection() {
        document.getElementById('paymentDetails').classList.add('hidden');
        document.getElementById('proofSection').classList.remove('hidden');
        // Hide the initial action buttons to keep UI clean
        document.getElementById('actionButtons').classList.add('hidden');
    }

    function submitDetails() {
        let name = document.getElementById('userName').value.trim();
        let email = document.getElementById('userEmail').value.trim();
        let wa = document.getElementById('userWa').value.trim();
        let trx = document.getElementById('trxId').value.trim();
        let pDate = document.getElementById('paymentDate').value.trim();
        let sName = document.getElementById('senderName').value.trim();

        if(!name || !email || !wa || !trx) {
            alert("Bara-e-meharbani Name, Gmail, WhatsApp Number aur TRX ID zaroor likhein!");
            return;
        }

        document.getElementById('submitBtn').innerText = "Please Wait...";
        document.getElementById('submitBtn').disabled = true;

        // Save User Data directly to Realtime Database (No storage needed)
        db.ref('users/' + wa).set({
            name: name,
            email: email,
            whatsapp: wa,
            trxId: trx,
            paymentDate: pDate || "N/A",
            senderName: sName || "N/A",
            status: 'pending'
        }).then(() => {
            localStorage.setItem('userWa', wa);
            alert("Aap ki details successfully send ho gayi hain! Admin ki approval ka intezar karein.");
            window.location.reload();
        }).catch((error) => {
            alert("Error: " + error.message);
            document.getElementById('submitBtn').innerText = "Submit for Approval";
            document.getElementById('submitBtn').disabled = false;
        });
    }
</script>
</body>
</html>

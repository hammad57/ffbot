<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - Game Setup</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #eef2f3; padding: 20px; margin: 0; }
        .container { max-width: 1200px; margin: auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        h1 { text-align: center; color: #333; margin-bottom: 30px; }
        .section { margin-bottom: 30px; padding: 20px; border: 1px solid #e1e4e8; border-radius: 8px; background: #fdfdfd; }
        h3 { margin-top: 0; color: #444; border-bottom: 2px solid #007bff; padding-bottom: 10px; display: inline-block; }
        label { font-weight: bold; display: block; margin-top: 15px; margin-bottom: 5px; color: #555; }
        input[type="text"] { width: 100%; max-width: 600px; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { padding: 10px 18px; cursor: pointer; border: none; border-radius: 5px; color: white; font-weight: bold; margin-top: 15px; }
        .btn-save { background: #10b981; }
        .btn-save:hover { background: #059669; }
        .btn-approve { background: #2563eb; font-size: 12px; margin-top: 0; padding: 6px 10px; }
        .btn-unapprove { background: #f59e0b; font-size: 12px; margin-top: 0; padding: 6px 10px; }
        .btn-delete { background: #ef4444; font-size: 12px; margin-top: 0; padding: 6px 10px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
        th, td { border: 1px solid #e2e8f0; padding: 12px; text-align: left; }
        th { background-color: #f1f5f9; color: #334155; }
        tr:nth-child(even) { background-color: #f8fafc; }
        .badge { padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; text-transform: uppercase; }
        .badge-pending { background-color: #fef3c7; color: #d97706; }
        .badge-approved { background-color: #d1fae5; color: #059669; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

<div class="container">
    <h1>Admin Dashboard</h1>

    <div class="section">
        <h3>Main Page Settings</h3>
        
        <label>Google Drive Download Link:</label>
        <input type="text" id="driveLinkInput" placeholder="https://drive.google.com/file/d/....">
        
        <label>Download Button Text:</label>
        <input type="text" id="btnTextInput" placeholder="e.g. Download Game OR Coming Soon">
        
        <label>Poster Image URLs (Comma laga kar alag karein):</label>
        <input type="text" id="postersInput" placeholder="https://image1.png, https://image2.jpg">
        <br>
        <button class="btn-save" onclick="updateSettings()">Save Settings</button>
    </div>

    <div class="section" style="overflow-x: auto;">
        <h3>Users / Payments Management</h3>
        <table>
            <thead>
                <tr>
                    <th>Name / Email</th>
                    <th>WhatsApp</th>
                    <th>TRX ID</th>
                    <th>Sender Name</th>
                    <th>Date</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="usersTable">
                </tbody>
        </table>
    </div>
</div>

<script>
    // FIREBASE CONFIGURATION
    const firebaseConfig = {
        databaseURL: "https://earn-platform-76c26-default-rtdb.firebaseio.com/"
    };
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    // Load Settings
    db.ref('settings').on('value', (snapshot) => {
        const data = snapshot.val();
        if(data) {
            document.getElementById('driveLinkInput').value = data.driveLink || "";
            document.getElementById('btnTextInput').value = data.buttonText || "";
            document.getElementById('postersInput').value = data.posters || "";
        }
    });

    // Save Settings
    function updateSettings() {
        let link = document.getElementById('driveLinkInput').value.trim();
        let text = document.getElementById('btnTextInput').value.trim();
        let posters = document.getElementById('postersInput').value.trim();

        db.ref('settings').set({
            driveLink: link,
            buttonText: text,
            posters: posters
        }).then(() => alert("Settings successfully update ho gayi hain!"));
    }

    // Load Users
    db.ref('users').on('value', (snapshot) => {
        let tbody = document.getElementById('usersTable');
        tbody.innerHTML = ""; 
        
        snapshot.forEach((childSnapshot) => {
            let user = childSnapshot.val();
            let waKey = childSnapshot.key;
            
            let statusBadge = user.status === 'approved' ? 
                `<span class="badge badge-approved">Approved</span>` : 
                `<span class="badge badge-pending">Pending</span>`;

            let tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${user.name}</strong><br><span style="color: #666; font-size: 12px;">${user.email}</span></td>
                <td>${user.whatsapp}</td>
                <td style="font-family: monospace; font-size: 15px; color: #007bff;">${user.trxId}</td>
                <td>${user.senderName || 'N/A'}</td>
                <td>${user.paymentDate || 'N/A'}</td>
                <td>${statusBadge}</td>
                <td style="min-width: 220px;">
                    <button class="btn-approve" onclick="updateStatus('${waKey}', 'approved')">Approve</button>
                    <button class="btn-unapprove" onclick="updateStatus('${waKey}', 'pending')">Unapprove</button>
                    <button class="btn-delete" onclick="deleteUser('${waKey}')">Delete</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    });

    function updateStatus(wa, status) {
        db.ref('users/' + wa).update({ status: status });
    }

    function deleteUser(wa) {
        if(confirm("Kiya aap waqai is user ko delete karna chahte hain?")) {
            db.ref('users/' + wa).remove();
        }
    }
</script>
</body>
</html>

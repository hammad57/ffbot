<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel - Game Store</title>
    <style>
        body { font-family: Arial, sans-serif; background: #e0e7ff; padding: 20px; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 20px; border-radius: 8px; }
        .section { margin-bottom: 30px; padding: 15px; border: 1px solid #ccc; border-radius: 5px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background-color: #4f46e5; color: white; }
        input[type="text"] { width: 80%; padding: 8px; margin: 5px 0; }
        button { padding: 8px 15px; cursor: pointer; border: none; border-radius: 4px; color: white; }
        .btn-save { background: #10b981; }
        .btn-approve { background: #2563eb; }
        .btn-unapprove { background: #f59e0b; }
        .btn-delete { background: #ef4444; }
        img.proof { width: 50px; height: 50px; cursor: pointer; transition: 0.3s; }
        img.proof:hover { transform: scale(3); position: relative; z-index: 100; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

<div class="container">
    <h1 style="text-align: center;">Admin Dashboard</h1>

    <div class="section">
        <h3>Main Page Settings</h3>
        <label>Google Drive Download Link:</label><br>
        <input type="text" id="driveLinkInput" placeholder="https://drive.google.com/file/d/...."><br>
        
        <label>Download Button Text:</label><br>
        <input type="text" id="btnTextInput" placeholder="e.g. Download Now OR Coming Soon"><br>
        
        <label>Poster Image URLs (Comma se alag karein):</label><br>
        <input type="text" id="postersInput" placeholder="https://image1.png, https://image2.jpg"><br><br>
        
        <button class="btn-save" onclick="updateSettings()">Save Settings</button>
    </div>

    <div class="section">
        <h3>Users / Payments Management</h3>
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>WhatsApp</th>
                    <th>TRX ID</th>
                    <th>Screenshot</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="usersTable">
                </tbody>
        </table>
    </div>
</div>

<script>
    // FIREBASE CONFIGURATION (Same as index.html)
    const firebaseConfig = {
        databaseURL: "https://earn-platform-76c26-default-rtdb.firebaseio.com/"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Load Settings
    db.ref('settings').on('value', (snapshot) => {
        const data = snapshot.val();
        if(data) {
            document.getElementById('driveLinkInput').value = data.driveLink || "";
            document.getElementById('btnTextInput').value = data.buttonText || "";
            document.getElementById('postersInput').value = data.posters || "";
        }
    });

    // Update Settings Function
    function updateSettings() {
        let link = document.getElementById('driveLinkInput').value;
        let text = document.getElementById('btnTextInput').value;
        let posters = document.getElementById('postersInput').value;

        db.ref('settings').set({
            driveLink: link,
            buttonText: text,
            posters: posters
        }).then(() => alert("Settings Updated Successfully!"));
    }

    // Load Users Real-time
    db.ref('users').on('value', (snapshot) => {
        let tbody = document.getElementById('usersTable');
        tbody.innerHTML = ""; // Clear table
        
        snapshot.forEach((childSnapshot) => {
            let user = childSnapshot.val();
            let waKey = childSnapshot.key;
            
            let tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${user.name}</td>
                <td>${user.whatsapp}</td>
                <td>${user.trxId}</td>
                <td><a href="${user.screenshot}" target="_blank"><img src="${user.screenshot}" class="proof"></a></td>
                <td style="font-weight:bold; color: ${user.status === 'approved' ? 'green' : 'red'};">${user.status.toUpperCase()}</td>
                <td>
                    <button class="btn-approve" onclick="updateStatus('${waKey}', 'approved')">Approve</button>
                    <button class="btn-unapprove" onclick="updateStatus('${waKey}', 'pending')">Unapprove</button>
                    <button class="btn-delete" onclick="deleteUser('${waKey}')">Delete</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    });

    function updateStatus(wa, status) {
        db.ref('users/' + wa).update({ status: status });
    }

    function deleteUser(wa) {
        if(confirm("Kiya aap waqai is user ko delete karna chahte hain?")) {
            db.ref('users/' + wa).remove();
        }
    }
</script>
</body>
</html>

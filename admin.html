<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - Game Setup</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #eef2f3; padding: 20px; margin: 0; }
        .container { max-width: 1200px; margin: auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        h1 { text-align: center; color: #333; margin-bottom: 30px; }
        .section { margin-bottom: 30px; padding: 20px; border: 1px solid #e1e4e8; border-radius: 8px; background: #fdfdfd; }
        h3 { margin-top: 0; color: #444; border-bottom: 2px solid #007bff; padding-bottom: 10px; display: inline-block; }
        label { font-weight: bold; display: block; margin-top: 15px; margin-bottom: 5px; color: #555; }
        input[type="text"] { width: 100%; max-width: 600px; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { padding: 10px 18px; cursor: pointer; border: none; border-radius: 5px; color: white; font-weight: bold; margin-top: 15px; }
        .btn-save { background: #10b981; }
        .btn-save:hover { background: #059669; }
        .btn-blue { background: #3b82f6; }
        .btn-blue:hover { background: #2563eb; }
        .btn-approve { background: #2563eb; font-size: 12px; margin-top: 0; padding: 6px 10px; }
        .btn-unapprove { background: #f59e0b; font-size: 12px; margin-top: 0; padding: 6px 10px; }
        .btn-delete { background: #ef4444; font-size: 12px; margin-top: 0; padding: 6px 10px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
        th, td { border: 1px solid #e2e8f0; padding: 12px; text-align: left; }
        th { background-color: #f1f5f9; color: #334155; }
        tr:nth-child(even) { background-color: #f8fafc; }
        .badge { padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; text-transform: uppercase; }
        .badge-pending { background-color: #fef3c7; color: #d97706; }
        .badge-approved { background-color: #d1fae5; color: #059669; }
        
        /* Multiple Files CSS */
        .file-entry { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; }
        .file-entry input { margin: 0; max-width: none; }
        
        @media (max-width: 768px) {
            .file-entry { flex-direction: column; align-items: flex-start; }
            .file-entry input { width: 100%; }
            .file-entry button { width: 100%; margin-top: 5px; }
        }
    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

<div class="container">
    <h1><i class="fas fa-user-shield"></i> Admin Dashboard</h1>

    <div class="section">
        <h3><i class="fas fa-cogs"></i> Main Page Settings</h3>
        
        <label>Download Button Text (General):</label>
        <input type="text" id="btnTextInput" placeholder="e.g. Download Game OR Coming Soon">
        
        <label>Poster Image URLs (Comma laga kar alag karein):</label>
        <input type="text" id="postersInput" placeholder="https://image1.png, https://image2.jpg">
        
        <hr style="border: 0; border-top: 1px solid #e1e4e8; margin: 25px 0;">
        
        <h4 style="margin-bottom: 10px; color: #333;"><i class="fas fa-file-archive"></i> Upload Multiple Game Files</h4>
        <div id="fileInputsContainer">
            </div>
        <button class="btn-blue" style="font-size: 13px; padding: 8px 12px;" onclick="addFileField('', '')"><i class="fas fa-plus"></i> Add Another File Link</button>
        <br><br>
        
        <button class="btn-save" onclick="updateSettings()"><i class="fas fa-save"></i> Save All Settings</button>
    </div>

    <div class="section" style="overflow-x: auto;">
        <h3><i class="fas fa-users"></i> Users / Payments Management</h3>
        <table>
            <thead>
                <tr>
                    <th>Name / Email</th>
                    <th>WhatsApp</th>
                    <th>TRX ID</th>
                    <th>Sender Name</th>
                    <th>Date</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="usersTable">
                </tbody>
        </table>
    </div>
</div>

<script>
    // FIREBASE CONFIGURATION
    const firebaseConfig = {
        databaseURL: "https://earn-platform-76c26-default-rtdb.firebaseio.com/"
    };
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    // Dynamically Add Input Fields for Files
    function addFileField(name, link) {
        let container = document.getElementById('fileInputsContainer');
        let div = document.createElement('div');
        div.className = 'file-entry';
        div.innerHTML = `
            <input type="text" class="f-name" placeholder="File Name (e.g. OBB File)" value="${name}" style="flex: 1;">
            <input type="text" class="f-link" placeholder="Google Drive Download Link" value="${link}" style="flex: 2;">
            <button class="btn-delete" style="margin-top: 0; padding: 10px 15px;" onclick="this.parentElement.remove()"><i class="fas fa-trash"></i></button>
        `;
        container.appendChild(div);
    }

    // Load Settings
    db.ref('settings').once('value').then((snapshot) => {
        const data = snapshot.val();
        if(data) {
            document.getElementById('btnTextInput').value = data.buttonText || "";
            document.getElementById('postersInput').value = data.posters || "";
            
            // Load Multiple Files
            if(data.files && data.files.length > 0) {
                document.getElementById('fileInputsContainer').innerHTML = '';
                data.files.forEach(f => addFileField(f.name, f.link));
            } else {
                addFileField('', ''); // Empty default row
            }
        } else {
            addFileField('', ''); // Empty default row if no data
        }
    });

    // Save Settings
    function updateSettings() {
        let text = document.getElementById('btnTextInput').value.trim();
        let posters = document.getElementById('postersInput').value.trim();

        // Extract all files from inputs
        let filesArr = [];
        document.querySelectorAll('.file-entry').forEach(entry => {
            let n = entry.querySelector('.f-name').value.trim();
            let l = entry.querySelector('.f-link').value.trim();
            if(n && l) {
                filesArr.push({ name: n, link: l });
            }
        });

        db.ref('settings').set({
            buttonText: text,
            posters: posters,
            files: filesArr
        }).then(() => alert("Settings aur Files successfully update ho gayi hain!"));
    }

    // Load Users
    db.ref('users').on('value', (snapshot) => {
        let tbody = document.getElementById('usersTable');
        tbody.innerHTML = ""; 
        
        snapshot.forEach((childSnapshot) => {
            let user = childSnapshot.val();
            let waKey = childSnapshot.key;
            
            let statusBadge = user.status === 'approved' ? 
                `<span class="badge badge-approved">Approved</span>` : 
                `<span class="badge badge-pending">Pending</span>`;

            let tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${user.name}</strong><br><span style="color: #666; font-size: 12px;">${user.email}</span></td>
                <td>${user.whatsapp}</td>
                <td style="font-family: monospace; font-size: 15px; color: #007bff;">${user.trxId}</td>
                <td>${user.senderName || 'N/A'}</td>
                <td>${user.paymentDate || 'N/A'}</td>
                <td>${statusBadge}</td>
                <td style="min-width: 220px;">
                    <button class="btn-approve" onclick="updateStatus('${waKey}', 'approved')">Approve</button>
                    <button class="btn-unapprove" onclick="updateStatus('${waKey}', 'pending')">Unapprove</button>
                    <button class="btn-delete" onclick="deleteUser('${waKey}')">Delete</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    });

    function updateStatus(wa, status) {
        db.ref('users/' + wa).update({ status: status });
    }

    function deleteUser(wa) {
        if(confirm("Kiya aap waqai is user ko delete karna chahte hain?")) {
            db.ref('users/' + wa).remove();
        }
    }
</script>
</body>
</html>
